name: ScrubJay
options:
  bundleIdPrefix: dev.openwhale
  deploymentTarget:
    macOS: "14.0"
packages:
  ScrubJayKit:
    path: .
targets:
  ScrubJayHelper:
    type: tool
    platform: macOS
    sources:
      - Helper
      - Sources/ScrubJayKit/Remove/HelperProtocol.swift
    settings:
      base:
        PRODUCT_NAME: dev.openwhale.scrubjay.helper
        PRODUCT_BUNDLE_IDENTIFIER: dev.openwhale.scrubjay.helper
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: 67ULUSQ947
        OTHER_CODE_SIGN_FLAGS: "-i dev.openwhale.scrubjay.helper"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: 6.0
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "-i dev.openwhale.scrubjay.helper --timestamp"
  ScrubJay:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: ScrubJayKit
        product: ScrubJayKit
      - target: ScrubJayHelper
        embed: false
    postBuildScripts:
      - name: Embed privileged helper
        script: /usr/bin/env python3 "${SRCROOT}/tools/embed_helper.py"
        basedOnDependencyAnalysis: false
    info:
      path: App/Info.plist
      properties:
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openwhale.scrubjay
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: 67ULUSQ947
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: 6.0
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
