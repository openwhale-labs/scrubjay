name: ScrubJay
options:
  bundleIdPrefix: dev.openwhale
  deploymentTarget:
    macOS: "14.0"
packages:
  ScrubJayKit:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.5
targets:
  ScrubJayHelper:
    type: tool
    platform: macOS
    sources:
      - Helper
      - Sources/ScrubJayKit/Remove/HelperProtocol.swift
    settings:
      base:
        PRODUCT_NAME: dev.openwhale.scrubjay.helper
        PRODUCT_BUNDLE_IDENTIFIER: dev.openwhale.scrubjay.helper
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: 67ULUSQ947
        OTHER_CODE_SIGN_FLAGS: "-i dev.openwhale.scrubjay.helper"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: 6.0
        ARCHS: "$(ARCHS_STANDARD)"
        ONLY_ACTIVE_ARCH: NO
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "-i dev.openwhale.scrubjay.helper --timestamp"
  ScrubJay:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: ScrubJayKit
        product: ScrubJayKit
      - package: Sparkle
        product: Sparkle
      - target: ScrubJayHelper
        embed: false
    preBuildScripts:
      - name: SwiftLint
        script: |
          if command -v swiftlint >/dev/null; then
            swiftlint lint --quiet --config "${SRCROOT}/.swiftlint.yml"
          else
            echo "warning: swiftlint not installed — brew install swiftlint"
          fi
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed privileged helper
        script: /usr/bin/env python3 "${SRCROOT}/tools/embed_helper.py"
        basedOnDependencyAnalysis: false
    info:
      path: App/Info.plist
      properties:
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://dl.openwhale.dev/scrubjay/appcast.xml
        SUEnableAutomaticChecks: true
        SUPublicEDKey: OadJI+5ztB9ukGXhSmhtz2c6CH1YDX7UhU+YMR6WLH4=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openwhale.scrubjay
        MARKETING_VERSION: 0.1.1
        CURRENT_PROJECT_VERSION: 2
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: 67ULUSQ947
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: 6.0
        ARCHS: "$(ARCHS_STANDARD)"
        ONLY_ACTIVE_ARCH: NO
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
